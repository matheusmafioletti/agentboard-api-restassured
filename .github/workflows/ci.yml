name: API Tests — RestAssured + Cucumber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'local'
        type: choice
        options: [local, staging]
      tags:
        description: 'Cucumber tag filter (e.g. @smoke)'
        required: false
        default: '@smoke'

permissions:
  contents: read
  packages: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: latest
          board_tag: latest
          api_docs_tag: latest
          web_tag: e2e-latest
          action: up

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Run smoke tests
        run: |
          mvn test \
            -Denv=${{ github.event.inputs.environment || 'local' }} \
            -Dbase.url.auth=http://localhost:8080 \
            -Dbase.url.board=http://localhost:8080 \
            -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke' }}"

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 30
          if-no-files-found: ignore

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: latest
          board_tag: latest
          api_docs_tag: latest
          web_tag: e2e-latest
          action: down
